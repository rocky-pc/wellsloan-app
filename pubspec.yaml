name: wellsloan_app
description: "Wellsloan Customer Mobile App - Next-Gen Fintech & Micro-Lending Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1
  
  # Secure Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  
  # Visuals, Icons, Typography & Charts
  google_fonts: ^6.2.1
  intl: ^0.19.0
  fl_chart: ^0.68.0
  
  # Multimedia & Camera
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  
  # Security & Biometrics
  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
